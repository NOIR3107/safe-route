name: Backend CI

on:
  push:
    paths: ["app/**", "tests/**", "requirements*.txt", "pytest.ini", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["app/**", "tests/**", "requirements*.txt", "pytest.ini", ".github/workflows/backend-ci.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest --cov=app --cov-report=term --cov-report=xml --junitxml=reports/pytest-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: |
            reports/pytest-junit.xml
            coverage.xml
