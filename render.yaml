# Render Blueprint for the SafeRoute backend (FastAPI). The frontend is deployed on Vercel and the
# database is Supabase; see DEPLOY.md. Values marked sync: false are entered in the Render dashboard.
services:
  - type: web
    name: saferoute-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DRILL_DATABASE_URL
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://safe-route[a-z0-9-]*\.vercel\.app
      - key: SECRET_KEY
        generateValue: true
      - key: INGEST_TOKEN
        generateValue: true
      - key: DEMO_ACCOUNTS
        value: "true"
